<svg xmlns="http://www.w3.org/2000/svg" width="680" height="834" viewBox="0 0 680 834" role="img" aria-labelledby="t d">
<title id="t">Which sign-in methods resist phishing</title>
<desc id="d">Sign-in methods by phishing resistance. Passkeys and security keys resist phishing. Below a line marking what a fake sign-in page can relay: Google prompts and authenticator codes are phishable; text or voice codes and a password alone are weak. No method stops malware that steals a signed-in session.</desc>
<style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }</style>
<rect x="0.5" y="0.5" width="679" height="833" rx="16" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="24" y="52" font-size="28" font-weight="700" fill="#1f2328" text-anchor="start">Which sign-in methods resist phishing</text>
<text x="24" y="89.0" font-size="22" font-weight="400" fill="#59636e" text-anchor="start">Which methods a fake sign-in page can relay</text>
<rect x="16.5" y="126.7" width="647" height="105.7" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
<rect x="26" y="140.7" width="6" height="77.7" rx="3" fill="#1a7f37"/>
<rect x="386.2" y="144.3" width="257.8" height="36" rx="18" fill="#dafbe1"/>
<text x="515.1" y="170.2" font-size="22" font-weight="700" fill="#1a7f37" text-anchor="middle">Phishing-resistant</text>
<text x="44" y="170.7" font-size="24" font-weight="700" fill="#1f2328" text-anchor="start">Passkey or security key</text>
<text x="44" y="208.4" font-size="22" font-weight="400" fill="#59636e" text-anchor="start">Works only on Google's real site.</text>
<line x1="16" y1="292.0" x2="664" y2="292.0" stroke="#cf222e" stroke-width="2" stroke-dasharray="7 7"/>
<rect x="61.8" y="254.4" width="556.4" height="75.2" rx="12" fill="#f6f8fa" stroke="#cf222e" stroke-width="1.5"/>
<text x="340.0" y="285.4" font-size="22" font-weight="700" fill="#cf222e" text-anchor="middle">Everything below this line can be relayed</text>
<text x="340.0" y="314.0" font-size="22" font-weight="700" fill="#cf222e" text-anchor="middle">by a fake sign-in page</text>
<rect x="16.5" y="349.6" width="647" height="135.7" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
<rect x="26" y="363.6" width="6" height="107.7" rx="3" fill="#9a6700"/>
<rect x="494.4" y="367.2" width="149.6" height="36" rx="18" fill="#fff8c5"/>
<text x="569.2" y="393.1" font-size="22" font-weight="700" fill="#9a6700" text-anchor="middle">Phishable</text>
<text x="44" y="393.6" font-size="24" font-weight="700" fill="#1f2328" text-anchor="start">Google prompt or</text>
<text x="44" y="423.6" font-size="24" font-weight="700" fill="#1f2328" text-anchor="start">authenticator code</text>
<text x="44" y="461.3" font-size="22" font-weight="400" fill="#59636e" text-anchor="start">A fake page passes them on as you approve or type.</text>
<rect x="16.5" y="497.3" width="647" height="105.7" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
<rect x="26" y="511.3" width="6" height="77.7" rx="3" fill="#cf222e"/>
<rect x="548.0" y="514.9" width="96.0" height="36" rx="18" fill="#ffebe9"/>
<text x="596.0" y="540.8" font-size="22" font-weight="700" fill="#cf222e" text-anchor="middle">Weak</text>
<text x="44" y="541.3" font-size="24" font-weight="700" fill="#1f2328" text-anchor="start">Text or voice code</text>
<text x="44" y="579.0" font-size="22" font-weight="400" fill="#59636e" text-anchor="start">Relayed by fake pages and caught by SIM swaps.</text>
<rect x="16.5" y="615.0" width="647" height="105.7" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
<rect x="26" y="629.0" width="6" height="77.7" rx="3" fill="#cf222e"/>
<rect x="548.0" y="632.6" width="96.0" height="36" rx="18" fill="#ffebe9"/>
<text x="596.0" y="658.5" font-size="22" font-weight="700" fill="#cf222e" text-anchor="middle">Weak</text>
<text x="44" y="659.0" font-size="24" font-weight="700" fill="#1f2328" text-anchor="start">Password alone</text>
<text x="44" y="696.7" font-size="22" font-weight="400" fill="#59636e" text-anchor="start">Phished, leaked and reused.</text>
<text x="340.0" y="760.7" font-size="22" font-weight="700" fill="#1f2328" text-anchor="middle">No sign-in method stops malware that steals</text>
<text x="340.0" y="790.4" font-size="22" font-weight="700" fill="#1f2328" text-anchor="middle">your signed-in session.</text>
</svg>
