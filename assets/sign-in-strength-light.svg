<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="664" viewBox="0 0 1000 664" role="img" aria-labelledby="t d">
<title id="t">Phishing resistance by sign-in method</title>
<desc id="d">Sign-in methods ranked strongest to weakest. 1. Hardware security key (Phishing-resistant): Phishing-proof. The secret never leaves the key. 2. Passkey (Phishing-resistant): Phishing-proof. Synced end-to-end encrypted. 3. Google prompt (Phishable): Shows where a sign-in comes from, but relayable. 4. Authenticator app code (Phishable): Immune to SIM swaps. Relayed by phishing kits. 5. Text or voice code (Weak): Hit by SIM swaps and relayed by phishing kits. 6. Password alone (Weak): Phished, leaked and reused. Never enough.</desc>
<style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }</style>
