<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="584" viewBox="0 0 1000 584" role="img" aria-labelledby="t d">
<title id="t">Three levels of hardening</title>
<desc id="d">Baseline (Everyone. About 20 minutes, free.): Passkeys on every device, 2-Step Verification on, Backup codes offline, Recovery info and contacts, Devices and apps reviewed, Gmail forwarding checked, Carrier SIM lock on. Enhanced (Money, crypto, a business, an audience or admin access.): Two hardware security keys, No text message codes, Saved passwords encrypted, Recovery email hardened, Calendar invite filter on, Third-party cookies off, 3-month auto-delete. Maximum (Journalists, activists, executives, anyone targeted.): Advanced Protection on, Phone lockdown mode on, No apps with mail access, Separate accounts per role, Dedicated admin device, Gemini unlinked from apps, Backup key stored off-site.</desc>
<style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }</style>
<rect x="0.5" y="0.5" width="999" height="583" rx="16" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="32" y="54" font-size="27" font-weight="700" fill="#1f2328" text-anchor="start">Three levels of hardening</text>
<text x="32" y="84" font-size="16" font-weight="400" fill="#59636e" text-anchor="start">Each level includes everything before it. Go as far as your risk requires.</text>
<rect x="32" y="108" width="302" height="446" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
<path d="M44 108.5 H322 A11.5 11.5 0 0 1 333.5 120 V114 H32.5 V120 A11.5 11.5 0 0 1 44 108.5 Z" fill="#1a7f37"/>
