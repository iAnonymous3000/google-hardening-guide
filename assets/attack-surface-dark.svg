<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="t d">
<title id="t">Six doors into your Google account</title>
<desc id="d">Sign-in page: Phishing kits relay your password, codes and prompts in real time. Lock: Passkeys and security keys. Your devices: Infostealer malware copies your session cookies and saved passwords. Lock: Clean devices and signing out old sessions. Phone number: SIM swaps move your number to a criminal, along with your text codes. Lock: Carrier lock, no text codes. Recovery: A hijacked recovery email or phone resets your whole account. Lock: Strong recovery email and recovery contacts. Linked apps: Consent phishing plants an app token that outlives your password. Lock: Review linked apps, read every consent screen. You: Fake Google Support calls ask you to read a code or approve a prompt. Lock: Google never calls. Hang up..</desc>
<style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }</style>
<rect x="0.5" y="0.5" width="999" height="639" rx="16" fill="#151b23" stroke="#3d444d"/>
<text x="32" y="54" font-size="27" font-weight="700" fill="#f0f6fc" text-anchor="start">Six doors into your Google account</text>
<text x="32" y="84" font-size="16" font-weight="400" fill="#9198a1" text-anchor="start">Every control in this guide locks one of these doors.</text>
<rect x="32" y="112" width="302" height="242" rx="12" fill="#0d1117" stroke="#3d444d"/>
<circle cx="68" cy="148" r="17" fill="#0f2440"/><rect x="61" y="138" width="14" height="20" rx="2" fill="none" stroke="#4493f8" stroke-width="2"/><circle cx="71" cy="149" r="1.8" fill="#4493f8"/>
<text x="96" y="155" font-size="19" font-weight="700" fill="#f0f6fc" text-anchor="start">Sign-in page</text>
<text x="54" y="194" font-size="11.5" font-weight="700" fill="#f85149" text-anchor="start" letter-spacing="1.2">ATTACK</text>
<text x="54" y="218" font-size="15.5" font-weight="400" fill="#f0f6fc" text-anchor="start">Phishing kits relay your</text>
<text x="54" y="239" font-size="15.5" font-weight="400" fill="#f0f6fc" text-anchor="start">password, codes and prompts</text>
<text x="54" y="260" font-size="15.5" font-weight="400" fill="#f0f6fc" text-anchor="start">in real time</text>
<text x="54" y="295" font-size="11.5" font-weight="700" fill="#3fb950" text-anchor="start" letter-spacing="1.2">LOCK</text>
<text x="54" y="319" font-size="15.5" font-weight="700" fill="#f0f6fc" text-anchor="start">Passkeys and security keys</text>
<rect x="349" y="112" width="302" height="242" rx="12" fill="#0d1117" stroke="#3d444d"/>
<circle cx="385" cy="148" r="17" fill="#0f2440"/><rect x="378" y="138" width="14" height="20" rx="2" fill="none" stroke="#4493f8" stroke-width="2"/><circle cx="388" cy="149" r="1.8" fill="#4493f8"/>
<text x="413" y="155" font-size="19" font-weight="700" fill="#f0f6fc" text-anchor="start">Your devices</text>
<text x="371" y="194" font-size="11.5" font-weight="700" fill="#f85149" text-anchor="start" letter-spacing="1.2">ATTACK</text>
<text x="371" y="218" font-size="15.5" font-weight="400" fill="#f0f6fc" text-anchor="start">Infostealer malware copies</text>
<text x="371" y="239" font-size="15.5" font-weight="400" fill="#f0f6fc" text-anchor="start">your session cookies and</text>
<text x="371" y="260" font-size="15.5" font-weight="400" fill="#f0f6fc" text-anchor="start">saved passwords</text>
<text x="371" y="295" font-size="11.5" font-weight="700" fill="#3fb950" text-anchor="start" letter-spacing="1.2">LOCK</text>
<text x="371" y="319" font-size="15.5" font-weight="700" fill="#f0f6fc" text-anchor="start">Clean devices and signing</text>
<text x="371" y="340" font-size="15.5" font-weight="700" fill="#f0f6fc" text-anchor="start">out old sessions</text>
<rect x="666" y="112" width="302" height="242" rx="12" fill="#0d1117" stroke="#3d444d"/>
<circle cx="702" cy="148" r="17" fill="#0f2440"/><rect x="695" y="138" width="14" height="20" rx="2" fill="none" stroke="#4493f8" stroke-width="2"/><circle cx="705" cy="149" r="1.8" fill="#4493f8"/>
<text x="730" y="155" font-size="19" font-weight="700" fill="#f0f6fc" text-anchor="start">Phone number</text>
<text x="688" y="194" font-size="11.5" font-weight="700" fill="#f85149" text-anchor="start" letter-spacing="1.2">ATTACK</text>
<text x="688" y="218" font-size="15.5" font-weight="400" fill="#f0f6fc" text-anchor="start">SIM swaps move your number</text>
<text x="688" y="239" font-size="15.5" font-weight="400" fill="#f0f6fc" text-anchor="start">to a criminal, along with</text>
<text x="688" y="260" font-size="15.5" font-weight="400" fill="#f0f6fc" text-anchor="start">your text codes</text>
<text x="688" y="295" font-size="11.5" font-weight="700" fill="#3fb950" text-anchor="start" letter-spacing="1.2">LOCK</text>
<text x="688" y="319" font-size="15.5" font-weight="700" fill="#f0f6fc" text-anchor="start">Carrier lock, no text codes</text>
<rect x="32" y="368" width="302" height="242" rx="12" fill="#0d1117" stroke="#3d444d"/>
<circle cx="68" cy="404" r="17" fill="#0f2440"/><rect x="61" y="394" width="14" height="20" rx="2" fill="none" stroke="#4493f8" stroke-width="2"/><circle cx="71" cy="405" r="1.8" fill="#4493f8"/>
<text x="96" y="411" font-size="19" font-weight="700" fill="#f0f6fc" text-anchor="start">Recovery</text>
<text x="54" y="450" font-size="11.5" font-weight="700" fill="#f85149" text-anchor="start" letter-spacing="1.2">ATTACK</text>
<text x="54" y="474" font-size="15.5" font-weight="400" fill="#f0f6fc" text-anchor="start">A hijacked recovery email</text>
<text x="54" y="495" font-size="15.5" font-weight="400" fill="#f0f6fc" text-anchor="start">or phone resets your</text>
<text x="54" y="516" font-size="15.5" font-weight="400" fill="#f0f6fc" text-anchor="start">whole account</text>
<text x="54" y="551" font-size="11.5" font-weight="700" fill="#3fb950" text-anchor="start" letter-spacing="1.2">LOCK</text>
<text x="54" y="575" font-size="15.5" font-weight="700" fill="#f0f6fc" text-anchor="start">Strong recovery email and</text>
<text x="54" y="596" font-size="15.5" font-weight="700" fill="#f0f6fc" text-anchor="start">recovery contacts</text>
<rect x="349" y="368" width="302" height="242" rx="12" fill="#0d1117" stroke="#3d444d"/>
<circle cx="385" cy="404" r="17" fill="#0f2440"/><rect x="378" y="394" width="14" height="20" rx="2" fill="none" stroke="#4493f8" stroke-width="2"/><circle cx="388" cy="405" r="1.8" fill="#4493f8"/>
<text x="413" y="411" font-size="19" font-weight="700" fill="#f0f6fc" text-anchor="start">Linked apps</text>
<text x="371" y="450" font-size="11.5" font-weight="700" fill="#f85149" text-anchor="start" letter-spacing="1.2">ATTACK</text>
<text x="371" y="474" font-size="15.5" font-weight="400" fill="#f0f6fc" text-anchor="start">Consent phishing plants an</text>
<text x="371" y="495" font-size="15.5" font-weight="400" fill="#f0f6fc" text-anchor="start">app token that outlives</text>
<text x="371" y="516" font-size="15.5" font-weight="400" fill="#f0f6fc" text-anchor="start">your password</text>
<text x="371" y="551" font-size="11.5" font-weight="700" fill="#3fb950" text-anchor="start" letter-spacing="1.2">LOCK</text>
<text x="371" y="575" font-size="15.5" font-weight="700" fill="#f0f6fc" text-anchor="start">Review linked apps, read</text>
<text x="371" y="596" font-size="15.5" font-weight="700" fill="#f0f6fc" text-anchor="start">every consent screen</text>
<rect x="666" y="368" width="302" height="242" rx="12" fill="#0d1117" stroke="#3d444d"/>
<circle cx="702" cy="404" r="17" fill="#0f2440"/><rect x="695" y="394" width="14" height="20" rx="2" fill="none" stroke="#4493f8" stroke-width="2"/><circle cx="705" cy="405" r="1.8" fill="#4493f8"/>
<text x="730" y="411" font-size="19" font-weight="700" fill="#f0f6fc" text-anchor="start">You</text>
<text x="688" y="450" font-size="11.5" font-weight="700" fill="#f85149" text-anchor="start" letter-spacing="1.2">ATTACK</text>
<text x="688" y="474" font-size="15.5" font-weight="400" fill="#f0f6fc" text-anchor="start">Fake Google Support calls</text>
<text x="688" y="495" font-size="15.5" font-weight="400" fill="#f0f6fc" text-anchor="start">ask you to read a code or</text>
<text x="688" y="516" font-size="15.5" font-weight="400" fill="#f0f6fc" text-anchor="start">approve a prompt</text>
<text x="688" y="551" font-size="11.5" font-weight="700" fill="#3fb950" text-anchor="start" letter-spacing="1.2">LOCK</text>
<text x="688" y="575" font-size="15.5" font-weight="700" fill="#f0f6fc" text-anchor="start">Google never calls. Hang up.</text>
</svg>
